jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
        name: Install Dependencies
      - run: npm run lint
        name: Lint
on:
  push:
    branches:
      - main
  pull_request: {}
env:
  CI: "true"
